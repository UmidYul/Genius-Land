<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Margilan Atlas sketch</title>
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;background:#1F3A93;font-family:Georgia,serif;color:#fff}
.field{position:absolute;inset:0;display:flex}

.form{display:grid;grid-template-columns:1fr 1fr 130px;gap:12px;margin-top:32px}
.f{border-bottom:2px solid #1F3A93;height:44px;font:15px Arial;color:#777;padding-top:20px}

# Development services. Usage: `docker compose up -d`.
# Creates two databases: genius_land (development) and genius_land_test (integration tests).
name: genius-land

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-genius}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-genius}
      POSTGRES_DB: ${POSTGRES_DB:-genius_land}
      TZ: UTC
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
